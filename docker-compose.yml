services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_intelligence
    ports:
      # Bound to loopback only — Docker's own iptables rules bypass ufw, so a bare
      # "5432:5432" would expose Postgres to the internet regardless of the firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      - crypto_pg_data:/var/lib/postgresql/data

volumes:
  crypto_pg_data:
